<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기록 · 모니터링 트윈</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./dashboard.css">
</head>
<body class="page">
<header class="topbar page-top" id="topbar"></header>
<main class="page-main">
  <div class="toolbar">
    <h1>기록</h1>
    <div class="seg" id="tabs" role="group" aria-label="기록 종류"></div>
    <div class="chips" id="verdict" role="group" aria-label="판정"></div>
    <div class="seg" id="period" role="group" aria-label="기간"></div>
    <button type="button" class="btn" id="exportBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      데이터 내보내기
    </button>
  </div>

  <div class="records" id="runsView">
    <section class="table-card">
      <div class="trow thead runs-cols"><span>가동</span><span>시작</span><span>종료</span><span>판정</span><span>NG 사유</span><span class="num">ST1</span><span class="num">ST2</span><span class="num">ST3</span><span class="num">소요</span></div>
      <div class="tbody" id="runRows"></div>
      <div class="tfoot muted small" id="runFoot"></div>
    </section>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>

  <section class="table-card" id="alarmsView" hidden>
    <div class="trow thead alarm-cols"><span>발생</span><span>해제</span><span>지속</span><span>출처</span><span>코드</span><span>내용</span></div>
    <div class="tbody" id="alarmRows"></div>
  </section>
</main>
<script type="module" src="./ui/runs.js"></script>
</body>
</html>
